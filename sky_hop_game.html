<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Sky Hop</title>
<style>
  :root{
    --bg:#f5f7fb;
    --ink:#101114;
    --soft:#7b8290;
    --panel:rgba(255,255,255,.78);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
  body{touch-action:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,255,255,.95), rgba(242,245,250,.96) 48%, rgba(232,237,245,.98));
  }
  .hud{
    position:fixed;inset:0;pointer-events:none;
    padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .brand,.scorebox,.hint,.overlay-card{
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:var(--panel);border:1px solid rgba(255,255,255,.75);
    box-shadow:0 10px 30px rgba(38,48,65,.08)
  }
  .brand{padding:10px 14px;border-radius:18px;font-weight:800;letter-spacing:-.03em}
  .scorebox{padding:10px 14px;border-radius:18px;text-align:right;min-width:120px}
  .score{font-size:26px;line-height:1;font-weight:900;letter-spacing:-.05em}
  .best{font-size:11px;color:var(--soft);margin-top:4px;text-transform:uppercase;letter-spacing:.12em}
  .hint{align-self:center;padding:10px 14px;border-radius:999px;font-size:12px;color:#5f6673;margin-bottom:2px}
  .center{
    position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;
  }
  .overlay-card{
    pointer-events:auto;width:min(90vw,360px);padding:24px;border-radius:28px;text-align:center;
    opacity:0;transform:translateY(12px) scale(.98);transition:.2s ease;visibility:hidden
  }
  .overlay-card.show{opacity:1;transform:none;visibility:visible}
  h1{font-size:34px;margin:0 0 8px;letter-spacing:-.055em}
  p{color:#69717d;margin:0 0 18px;line-height:1.45;font-size:14px}
  button{
    border:0;border-radius:18px;padding:14px 18px;width:100%;font-weight:800;font-size:15px;
    background:#101114;color:white;cursor:pointer;
  }
  button:active{transform:scale(.98)}
  .touch-controls{
    position:fixed;inset:auto 0 max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;
    padding:0 22px;pointer-events:none;
  }
  .touch{
    pointer-events:auto;width:78px;height:78px;border-radius:50%;
    border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.38);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:grid;place-items:center;font-size:28px;font-weight:800;color:#15171b;
    user-select:none;-webkit-user-select:none;
  }
  @media (hover:hover) and (pointer:fine){.touch-controls{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="hud">
  <div class="top">
    <div class="brand">SKY HOP</div>
    <div class="scorebox">
      <div class="score" id="score">0</div>
      <div class="best">BEST <span id="best">0</span></div>
    </div>
  </div>
  <div class="hint">← → / A D · touch left / right</div>
</div>

<div class="center">
  <div class="overlay-card" id="gameOver">
    <h1>Game over</h1>
    <p>You climbed <b><span id="finalScore">0</span></b> points.</p>
    <button id="restart">Play again</button>
  </div>
</div>

<div class="touch-controls">
  <div class="touch" id="left">←</div>
  <div class="touch" id="right">→</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const gameOverEl = document.getElementById('gameOver');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restart');

  let W=0,H=0,DPR=1,last=0,running=true;
  const keys={left:false,right:false};

  const state={
    score:0,
    best:+(localStorage.getItem('skyhop-best')||0),
    cameraY:0,
    speedScale:1
  };
  bestEl.textContent=state.best;

  const player={
    x:0,y:0,w:34,h:42,vx:0,vy:0,
    accel:1900,maxSpeed:310,friction:0.86,jump:760,
    squash:0
  };

  let platforms=[];
  let particles=[];

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.floor(W*DPR);
    canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function reset(){
    state.score=0; state.cameraY=0; state.speedScale=1;
    running=true;
    gameOverEl.classList.remove('show');
    platforms=[];
    particles=[];
    player.x=W/2-player.w/2;
    player.y=H*0.65;
    player.vx=0; player.vy=-player.jump;
    platforms.push({x:W/2-55,y:H*0.78,w:110,h:14,type:'solid'});
    let y=H*0.65;
    for(let i=0;i<12;i++){
      y-=rand(70,112);
      platforms.push(makePlatform(y,i));
    }
    updateHud();
  }

  function makePlatform(y,i=0){
    const w=rand(72,118);
    const margin=18;
    const x=rand(margin,Math.max(margin,W-w-margin));
    return {x,y,w,h:12,type:(i>5 && Math.random()<0.16)?'moving':'solid',
      dir:Math.random()<.5?-1:1, speed:rand(28,55)
    };
  }

  function rand(a,b){return a+Math.random()*(b-a)}

  function update(dt){
    if(!running) return;

    const dir=(keys.left?-1:0)+(keys.right?1:0);
    if(dir){
      player.vx += dir*player.accel*dt;
      player.vx = Math.max(-player.maxSpeed,Math.min(player.maxSpeed,player.vx));
    }else{
      player.vx *= Math.pow(player.friction,dt*60);
    }

    const prevY=player.y;
    player.vy += 2050*dt;
    player.y += player.vy*dt;
    player.x += player.vx*dt;

    if(player.x>W) player.x=-player.w;
    if(player.x+player.w<0) player.x=W;

    for(const p of platforms){
      if(p.type==='moving'){
        p.x += p.dir*p.speed*dt;
        if(p.x<8){p.x=8;p.dir=1}
        if(p.x+p.w>W-8){p.x=W-8-p.w;p.dir=-1}
      }
    }

    if(player.vy>0){
      const prevBottom=prevY+player.h;
      const bottom=player.y+player.h;
      for(const p of platforms){
        if(
          prevBottom<=p.y+4 &&
          bottom>=p.y &&
          player.x+player.w>p.x+4 &&
          player.x<p.x+p.w-4
        ){
          player.y=p.y-player.h;
          player.vy=-player.jump*(1+Math.min(.12,state.score/5000));
          player.squash=1;
          burst(player.x+player.w/2,p.y);
          break;
        }
      }
    }

    const threshold=H*0.42;
    if(player.y<threshold && player.vy<0){
      const dy=threshold-player.y;
      player.y=threshold;
      for(const p of platforms) p.y+=dy;
      for(const q of particles) q.y+=dy;
      state.score += Math.floor(dy);
      state.speedScale=1+Math.min(.35,state.score/7000);
    }

    let highest=Math.min(...platforms.map(p=>p.y));
    while(highest>-80){
      highest-=rand(72,110);
      platforms.push(makePlatform(highest,platforms.length));
    }

    platforms=platforms.filter(p=>p.y<H+80);

    for(const q of particles){
      q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt;q.life-=dt;
    }
    particles=particles.filter(q=>q.life>0);

    player.squash=Math.max(0,player.squash-dt*6);

    if(player.y>H+80) endGame();
    updateHud();
  }

  function burst(x,y){
    for(let i=0;i<8;i++){
      particles.push({
        x,y,vx:rand(-90,90),vy:rand(-150,-50),life:rand(.25,.5),r:rand(1.8,3.5)
      });
    }
  }

  function endGame(){
    running=false;
    state.best=Math.max(state.best,state.score);
    localStorage.setItem('skyhop-best',state.best);
    finalScoreEl.textContent=state.score;
    bestEl.textContent=state.best;
    gameOverEl.classList.add('show');
  }

  function updateHud(){
    scoreEl.textContent=state.score;
    bestEl.textContent=state.best;
  }

  function drawBackground(){
    ctx.clearRect(0,0,W,H);

    ctx.globalAlpha=.22;
    ctx.fillStyle='#bcc7d8';
    const t=performance.now()/1000;
    for(let i=0;i<18;i++){
      const x=(i*127 + (i%3)*t*6)% (W+40)-20;
      const y=(i*83)%H;
      ctx.beginPath();ctx.arc(x,y,1.2+(i%4)*.3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawPlatforms(){
    for(const p of platforms){
      ctx.shadowColor='rgba(26,36,52,.13)';
      ctx.shadowBlur=14;ctx.shadowOffsetY=6;
      ctx.fillStyle=p.type==='moving'?'#626a78':'#121417';
      roundedRect(p.x,p.y,p.w,p.h,6);
      ctx.fill();
      ctx.shadowColor='transparent';

      ctx.fillStyle='rgba(255,255,255,.24)';
      roundedRect(p.x+5,p.y+2,p.w-10,2.5,2);
      ctx.fill();
    }
  }

  function drawPlayer(){
    const cx=player.x+player.w/2, cy=player.y+player.h/2;
    const sy=1-player.squash*.13, sx=1+player.squash*.09;
    ctx.save();
    ctx.translate(cx,cy);ctx.scale(sx,sy);

    ctx.shadowColor='rgba(0,0,0,.15)';ctx.shadowBlur=18;ctx.shadowOffsetY=8;
    ctx.fillStyle='#ffffff';
    roundedRect(-player.w/2,-player.h/2,player.w,player.h,12);
    ctx.fill();
    ctx.shadowColor='transparent';

    ctx.fillStyle='#15171b';
    ctx.beginPath();ctx.arc(-7,-5,2.2,0,Math.PI*2);ctx.arc(7,-5,2.2,0,Math.PI*2);ctx.fill();

    ctx.lineWidth=2;ctx.strokeStyle='#15171b';
    ctx.beginPath();ctx.arc(0,3,6,0.18*Math.PI,0.82*Math.PI);ctx.stroke();

    ctx.fillStyle='#15171b';
    roundedRect(-13,15,9,4,2);ctx.fill();
    roundedRect(4,15,9,4,2);ctx.fill();

    ctx.restore();
  }

  function drawParticles(){
    for(const q of particles){
      ctx.globalAlpha=Math.max(0,q.life*2);
      ctx.fillStyle='#6f7784';
      ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function draw(){
    drawBackground();
    drawPlatforms();
    drawParticles();
    drawPlayer();
  }

  function loop(ts){
    const dt=Math.min(.025,(ts-last)/1000||0);
    last=ts;
    update(dt*state.speedScale);
    draw();
    requestAnimationFrame(loop);
  }

  function setKey(e,on){
    const k=e.key.toLowerCase();
    if(['arrowleft','a'].includes(k)){keys.left=on;e.preventDefault()}
    if(['arrowright','d'].includes(k)){keys.right=on;e.preventDefault()}
    if(!running && on && [' ','enter'].includes(k)) reset();
  }

  addEventListener('keydown',e=>setKey(e,true),{passive:false});
  addEventListener('keyup',e=>setKey(e,false),{passive:false});
  addEventListener('resize',()=>{resize(); if(running) reset()});

  function bindHold(id,side){
    const el=document.getElementById(id);
    const on=e=>{e.preventDefault();keys[side]=true};
    const off=e=>{e.preventDefault();keys[side]=false};
    el.addEventListener('pointerdown',on,{passive:false});
    el.addEventListener('pointerup',off,{passive:false});
    el.addEventListener('pointercancel',off,{passive:false});
    el.addEventListener('pointerleave',off,{passive:false});
  }
  bindHold('left','left');
  bindHold('right','right');

  canvas.addEventListener('pointerdown',e=>{
    if(!running){reset();return}
    if(e.clientX<W/2){keys.left=true}else{keys.right=true}
  });
  canvas.addEventListener('pointerup',()=>{keys.left=false;keys.right=false});
  canvas.addEventListener('pointercancel',()=>{keys.left=false;keys.right=false});
  restartBtn.addEventListener('click',reset);

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
